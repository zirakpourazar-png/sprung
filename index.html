<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sprung">
<meta name="theme-color" content="#F2F4F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1A23" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Sprung</title>
<style>
:root{
  --paper:#F2F4F5; --surface:#FFFFFF; --ink:#000000; --muted:#55606A; --rule:#C7CFD6;
  --signal:#FAD201; --blue:#0A5A9C; --on-blue:#FFFFFF; --red:#C8102E; --green:#00804A;
  --ok-bg:#E2F2E8; --bad-bg:#FBE6E9; --near-bg:#FFF5C7;
  --display:"DIN Condensed","Bahnschrift SemiBold Condensed","Bahnschrift","Arial Narrow",sans-serif;
  --din:"DIN Alternate","Bahnschrift","Arial",sans-serif;
  --text:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0E1A23; --surface:#152530; --ink:#F2F4F5; --muted:#9DAEBA; --rule:#2C3F4C;
    --blue:#5AA6E6; --on-blue:#04131F; --red:#FF6B5E; --green:#45C97F;
    --ok-bg:#123222; --bad-bg:#3A1619; --near-bg:#36320F;
  }
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--text);-webkit-font-smoothing:antialiased}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 96px)}
h1,h2,p,ol,ul,dl,dd,blockquote{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header: yellow place-name sign + 30-stop line */
.top{display:flex;align-items:center;gap:14px}
.plate{background:var(--signal);color:#000;border:3px solid var(--signal);box-shadow:inset 0 0 0 2px #000;border-radius:6px;padding:9px 14px 7px;line-height:1}
.plate-tag{display:block;font:700 34px/.9 var(--display)}
.plate-of{display:block;font:600 13px/1.2 var(--din);margin-top:3px}
.top-meta{display:flex;flex-direction:column;gap:2px;font:600 15px/1.3 var(--din)}
.streak{color:var(--muted);font-weight:500}
.linie{display:block;width:100%;height:auto;margin:12px 0 22px}
.ln-rest{stroke:var(--rule);stroke-width:3}
.ln-done{stroke:var(--ink);stroke-width:3}
.st-done{fill:var(--ink)}
.st-next{fill:var(--paper);stroke:var(--rule);stroke-width:1.5}
.st-cur{fill:var(--signal);stroke:var(--ink);stroke-width:2}
.st-tick{stroke:var(--muted);stroke-width:1}

/* today: departure board */
.note{background:var(--near-bg);border-left:6px solid var(--signal);padding:10px 12px;border-radius:4px;margin-bottom:16px;font-size:15px}
.de-title{font:700 44px/.95 var(--display);letter-spacing:.005em}
.tr-title{color:var(--muted);font-weight:600;margin-top:6px}
.task{margin-top:12px;max-width:62ch}
.board{border-top:2px solid var(--ink);margin:20px 0 0}
.dep{display:grid;grid-template-columns:3.3ch 1fr 28px;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:14px 2px}
.dep-min{font:700 32px/1 var(--display);font-variant-numeric:tabular-nums}
.dep-min small{display:block;font:600 11px/1 var(--din);color:var(--muted);margin-top:2px}
.dep-name{font-size:18px;font-weight:600;line-height:1.25}
.dep-name small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:3px}
.dep-state{width:26px;height:26px;border-radius:50%;border:2px solid var(--rule);display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1}
.dep.is-done .dep-state{background:var(--green);border-color:var(--green);color:#fff}
.dep.is-done .dep-min,.dep.is-done .dep-name{color:var(--muted)}

/* buttons */
.btn{-webkit-appearance:none;appearance:none;min-height:48px;padding:11px 16px;border:2px solid var(--ink);border-radius:10px;background:transparent;color:var(--ink);font:600 16px/1.2 var(--text)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn-quiet{border-color:var(--rule);color:var(--muted)}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn.rec-on{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.mini{min-height:40px;padding:7px 12px;font-size:15px;border-radius:8px;border-width:1.5px}
.wide{display:block;width:100%;margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.row.two{display:grid;grid-template-columns:1fr 1fr}
.link{background:none;border:0;padding:6px 0;color:var(--blue);font:600 16px/1.2 var(--text);text-decoration:underline;text-underline-offset:3px}

/* blocks */
.bhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.timer{font:700 22px/1 var(--display);font-variant-numeric:tabular-nums;color:var(--muted)}
.bh-title{font:700 36px/1 var(--display);margin:4px 0 16px}
.sub{font:700 21px/1.15 var(--din);margin:26px 0 10px}
.meta{color:var(--muted);font-size:14px;margin-bottom:6px}
.hint{color:var(--muted);font-size:15px;margin-top:8px}
.prompt{font-size:20px;font-weight:600;margin-bottom:8px}
.de{font:600 28px/1.25 var(--text);margin:6px 0 4px}
.tr{color:var(--muted);font-size:18px}
.tr.big{color:var(--ink);font-size:24px;font-weight:600;line-height:1.3}
.answer{display:block;width:100%;margin:14px 0 4px;padding:13px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);font:500 20px/1.3 var(--text)}
.answer:disabled{opacity:.75}
textarea.answer{min-height:92px;font-size:18px;resize:vertical}
.intro p+p{margin-top:8px}
.reading{margin:10px 0;padding:12px 14px;border-left:4px solid var(--ink);background:var(--surface);font-size:18px}
.opts{display:grid;gap:10px;margin:14px 0 4px}
.opt{text-align:left;padding:13px 14px;border:2px solid var(--rule);border-radius:10px;background:var(--surface);font:500 17px/1.35 var(--text)}
.opt.is-right{border-color:var(--green);background:var(--ok-bg)}
.opt.is-wrong{border-color:var(--red);background:var(--bad-bg)}

/* feedback */
.fb{margin:12px 0 4px;padding:12px 14px;border-left:6px solid;border-radius:4px}
.fb.ok{border-color:var(--green);background:var(--ok-bg)}
.fb.near{border-color:var(--signal);background:var(--near-bg)}
.fb.bad{border-color:var(--red);background:var(--bad-bg)}
.fb.info{border-color:var(--blue);background:var(--surface)}
u.sp{text-decoration-line:underline;text-decoration-style:dotted;text-decoration-thickness:2px;text-underline-offset:4px}
.sp-note{margin:6px 0 0}
.diff{font-size:20px;line-height:1.4;margin:6px 0}
.diff.yours{font-size:16px;color:var(--muted)}
mark.miss{background:transparent;color:inherit;font-weight:700;text-decoration:underline;text-decoration-color:var(--green);text-decoration-thickness:3px;text-underline-offset:4px}
del.extra{color:var(--red);text-decoration-thickness:2px}
.tags{margin-top:10px}
.chip{display:inline-block;margin:0 6px 8px 0;padding:8px 12px;border:1.5px solid var(--rule);border-radius:999px;background:var(--surface);font:500 15px/1.2 var(--text)}
.chip.is-on{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* listen */
.steps{padding-left:1.4em;margin:8px 0}
.steps li{margin:3px 0}
.check{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:16px}
.check input{width:22px;height:22px;accent-color:var(--blue)}
.rate{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:15px;color:var(--muted)}
.rate .chip{margin:0}
.lines{list-style:none;padding:0;margin:16px 0 0;border-top:2px solid var(--ink)}
.line{padding:12px 6px;border-bottom:1px solid var(--rule)}
.line.is-cur{background:var(--near-bg)}
.who{display:block;font:700 14px/1 var(--din);color:var(--muted);margin-bottom:5px}
.line .de{font-size:20px;margin:0}
.line .de.is-hidden{color:var(--rule);letter-spacing:.2em}
.line .tr{font-size:15px;margin-top:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* produce / grammar */
.qas{list-style:none;padding:0;margin:0}
.qa{padding:14px 0;border-top:1px solid var(--rule)}
details{margin-top:4px}
summary{color:var(--blue);font-weight:600;cursor:pointer}
.points{padding-left:1.2em}
.points li{margin:6px 0}
.examples{list-style:none;padding:0;margin:14px 0 0}
.examples li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.de-s{display:block;font-weight:600}
.tr-s{display:block;color:var(--muted);font-size:15px}
.recbox{margin:16px 0}
.rectime{font:700 46px/1 var(--display);font-variant-numeric:tabular-nums;margin-top:12px;color:var(--red)}

/* progress / errors */
.result .level{font:700 48px/1 var(--display);margin:2px 0 10px}
.result p+p{margin-top:8px}
.bars{display:grid;gap:8px;margin-top:12px}
.bar{display:grid;grid-template-columns:8.5em 1fr 3.4em;gap:10px;align-items:center;font-size:14px}
.bar>span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.bar-track{display:block;height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--ink)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.facts dt{color:var(--muted);font-size:14px}
.facts dd{font:700 34px/1 var(--display)}
.top5{list-style:none;padding:0}
.top5 li{display:grid;grid-template-columns:2ch 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.rank{font:700 28px/1 var(--display)}
.errs{list-style:none;padding:0}
.errs li{padding:10px 0;border-top:1px solid var(--rule)}
.given{display:block;color:var(--red);font-size:15px}
.empty p{margin-top:8px}

/* settings */
.field{display:grid;gap:6px;margin-top:14px}
.field>span{font-weight:600;font-size:15px}
select{width:100%;padding:12px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);font:500 17px var(--text)}
input[type=range]{width:100%;accent-color:var(--blue)}

/* chrome */
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tab{position:relative;background:none;border:0;padding:15px 2px 13px;font:600 15px/1 var(--din);color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;left:18%;right:18%;top:0;height:4px;background:var(--signal)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:3px;border-radius:10px;background:var(--red);color:#fff;font:700 12px/20px var(--text);vertical-align:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);max-width:min(92vw,520px);padding:11px 16px;border-radius:10px;background:var(--ink);color:var(--paper);font-size:15px;z-index:30}
.modal{position:fixed;inset:0;display:grid;place-items:end center;background:rgba(0,0,0,.45);z-index:40}
.modal-card{width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--surface);padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);border-radius:14px 14px 0 0}
.modal-card textarea{min-height:40vh;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>

  // ---------- today ----------
  function blockInfo(key, c) {
    switch (key) {
      case 'placement': return state.placement ? 'Sonuç: ' + state.placement.level : 'Kelime, gramer, okuma, dinleme';
      case 'review': var k = dueCards().length; return k ? k + ' kart bekliyor' : 'Bugün kart yok';
      case 'learn': return (c.chunks || []).length + ' kalıp';
      case 'listen': return c.dialogue ? c.dialogue.title + ', ' + c.dialogue.lines.length + ' satır' : '';
      case 'produce': return (c.produce || []).length + ' cümle, ' + (c.questions || []).length + ' soru';
      case 'grammar': return c.grammar ? c.grammar.title : 'Bu gün için not yok';

    }

  function viewToday() {
    var n = state.programDay, head = topHeader(n);
    if (n > TOTAL_DAYS) {

        '<button class="btn btn-primary wide" data-act="tab" data-view="progress">İlerlemeyi aç</button></section>';
    }
    var c = getDay(n);
    if (!c) return head + needPack(n);
    var s = session(n), blocks = blocksFor(n, c);
    if (!s.blocks.review && blocks.some(function (b) { return b.key === 'review'; }) && !dueCards().length) { s.blocks.review = true; save(); }
    var rows = blocks.map(function (b) {

        '<span class="dep-min">' + b.min + '<small>dk</small></span>' +
        '<span class="dep-name">' + esc(b.name) + '<small>' + esc(blockInfo(b.key, c)) + '</small></span>' +
        '<span class="dep-state" aria-label="' + (done ? 'Tamamlandı' : 'Bekliyor') + '">' + (done ? '✓' : '') + '</span></button>';
    }).join('');
    var all = blocks.every(function (b) { return s.blocks[b.key]; });
    var first = (n === 1 && !state.startedAt) ? '<p class="note">İlk iş: Ayarlar’da sesi ve mikrofonu test et. Sonra blokları yukarıdan aşağı aç.</p>' : '';
    return head + '<section class="today">' + first +

      '<p class="task"><strong>Görev:</strong> ' + esc(c.task) + '</p>' +
      '<div class="board">' + rows + '</div>' +
      '<button class="btn ' + (all ? 'btn-primary' : 'btn-quiet') + ' wide" data-act="finish-day">Günü bitir</button></section>';

  function needPack(n) {
    return '<section class="empty"><h2 class="sub">Gün ' + n + ' için içerik yok</h2>' +
      '<p>Sonraki haftanın paketi için:</p><ol class="steps"><li>Haftalık dökümü kopyala.</li><li>Claude’a yapıştır.</li>' +
      '<li>Gelen JSON’u Ayarlar’daki “İçerik paketi” alanına yapıştır.</li></ol>' +
      '<div class="row"><button class="btn btn-primary" data-act="copy-dump">Haftalık dökümü kopyala</button>' +
      '<button class="btn" data-act="tab" data-view="settings">Paketi ekle</button></div></section>';
  }
  function finishDay() {
    var n = state.programDay, c = getDay(n); if (!c) return;
    var s = session(n), missing = blocksFor(n, c).filter(function (b) { return !s.blocks[b.key]; });
    if (missing.length && !window.confirm('Bitmemiş blok var: ' + missing.map(function (b) { return b.name; }).join(', ') + '. Yine de günü bitireyim mi?')) return;
    s.completedAt = today();
    if (state.completedDates.indexOf(today()) < 0) state.completedDates.push(today());
    if (!state.startedAt) state.startedAt = today();
    state.programDay = n + 1;
    save();
    go('today');
    toast('Gün ' + n + ' bitti.');

  // ---------- blocks ----------
  function blockHead(key) {
    return '<div class="bhead"><button class="link back" data-act="back">Bugün</button><span class="timer" id="tmr" aria-label="Geçen süre">0:00</span></div>' +
      '<h1 class="bh-title">' + esc(BLOCK_NAMES[key] || key) + '</h1>';
  }
  function viewBlock() {
    var c = getDay(state.programDay);

    var k = ui.block;

      : k === 'learn' ? viewLearn(c)

      : k === 'produce' ? viewProduce(c)

      : k === 'review' ? reviewBody(true)
      : k === 'baseline' ? viewBaseline() : '';

  }

  // placement
  function viewPlacement() {
    var t = ui.tmp.pl;
    if (!t && state.placement) return placementResult(state.placement);
    if (!t) {
      return '<section class="intro"><p>15–20 dakika sürer; soru sayısı cevaplarına göre değişir.</p>' +
        '<p>Bilmediğin soruda tahmin etme, “Bilmiyorum”a bas. Tahmin sonucu yanıltır.</p>' +
        '<button class="btn btn-primary wide" data-act="pl-start">Teste başla</button></section>';
    }
    var it = t.items[t.idx], n = t.results.length + (t.answered ? 0 : 1);
    var h = '<p class="meta">Soru ' + n + '</p><p class="prompt"' + (it.promptLang ? ' lang="' + it.promptLang + '"' : '') + '>' + esc(it.prompt) + '</p>';
    if (it.text) h += '<blockquote class="reading" lang="de">' + esc(it.text) + '</blockquote>';
    if (it.audio) h += '<button class="btn" data-act="say" data-text="' + esc(it.audio) + '">Sesi çal</button>';
    if (it.type === 'type') {
      h += answerInput(t.answered, t.given);
      h += t.answered ? plFeedback(t, it)
        : '<div class="row"><button class="btn btn-primary" data-primary data-act="pl-type">Kontrol et</button>' +
          '<button class="btn btn-quiet" data-act="pl-choose" data-i="-1">Bilmiyorum</button></div>';
      return h;
    }
    h += '<div class="opts"' + (it.optLang ? ' lang="' + it.optLang + '"' : '') + '>' + it.options.map(function (o, i) {
      var cls = '';
      if (t.answered) { if (i === it.answer) cls = ' is-right'; else if (i === t.chosen) cls = ' is-wrong'; }
      return '<button class="opt' + cls + '" data-act="pl-choose" data-i="' + i + '"' + (t.answered ? ' disabled' : '') + '>' + esc(o) + '</button>';
    }).join('') + '</div>';
    h += t.answered ? plFeedback(t, it) : '<button class="btn btn-quiet wide" data-act="pl-choose" data-i="-1">Bilmiyorum</button>';
    return h;
  }
  function plFeedback(t, it) {
    var right = it.type === 'type' ? it.answer.de : it.options[it.answer];
    var deLang = it.type === 'type' || it.optLang === 'de';
    return '<div class="fb ' + (t.lastCorrect ? 'ok' : 'bad') + '" role="status"><strong>' + (t.lastCorrect ? 'Doğru.' : 'Doğrusu:') + '</strong>' +
      (t.lastCorrect ? '' : ' <span' + (deLang ? ' lang="de"' : '') + '>' + esc(right) + '</span>') + '</div>' +
      '<button class="btn btn-primary wide" data-primary data-act="pl-next">Sonraki</button>';
  }
  function plStart() {
    ui.tmp.pl = { stage: 'A1', items: DATA.placement.A1.slice(), idx: 0, results: [], scores: {}, answered: false, chosen: null, lastCorrect: null, given: '' };
    ui.tmp.focus = true;
    render();
  }
  function plAnswer(correct, chosen, given) {
    var t = ui.tmp.pl, it = t.items[t.idx];
    t.answered = true; t.chosen = chosen; t.lastCorrect = correct; t.given = given || '';
    t.results.push({ id: it.id, stage: t.stage, skill: it.skill, correct: correct, item: it });
    render();
  }
  function plChoose(i) {
    var t = ui.tmp.pl; if (!t || t.answered) return;
    var it = t.items[t.idx];
    if (i < 0) { plAnswer(false, -1, ''); return; }
    plAnswer(i === it.answer, i, '');
  }
  function plType() {
    var t = ui.tmp.pl; if (!t || t.answered) return;
    var it = t.items[t.idx], v = ($('#ans') || {}).value || '';
    var r = C.checkAnswer(v, it.answer.de, it.answer.alt);
    if (r.status === 'empty') { toast('Önce cevabını yaz ya da “Bilmiyorum”a bas.'); return; }
    plAnswer(r.status !== 'wrong', null, v);
  }
  function plNext() {
    var t = ui.tmp.pl; if (!t) return;
    t.idx++; t.answered = false; t.chosen = null; t.given = '';
    if (t.idx < t.items.length) { ui.tmp.focus = true; render(); return; }
    var score = t.results.filter(function (r) { return r.stage === t.stage && r.correct; }).length;
    t.scores[t.stage] = score;
    if (t.stage === 'A1' && score >= 6) { t.stage = 'A2'; t.items = DATA.placement.A2.slice(); t.idx = 0; render(); return; }
    if (t.stage === 'A1' && score <= 3) { t.stage = 'A0'; t.items = DATA.placement.A0.slice(); t.idx = 0; render(); return; }
    plFinish();
  }
  function plFinish() {
    var t = ui.tmp.pl, lv = C.placementLevel(t.scores), per = {}, seeded = 0;
    t.results.forEach(function (r) {
      per[r.skill] = per[r.skill] || [0, 0]; per[r.skill][1]++; if (r.correct) per[r.skill][0]++;
      if (!r.correct && r.item.card && addCard('pl-' + r.id, r.item.card.tr, r.item.card.de, r.item.card.alt, 'placement', 1, 1)) seeded++;
    });
    state.placement = { level: lv.level, note: lv.note, scores: t.scores, perSkill: per, date: today(), seeded: seeded, asked: t.results.length };
    ui.tmp.pl = null;
    markDone('placement');
    render();
  }
  function placementResult(p) {
    var skills = Object.keys(p.perSkill || {}).map(function (k) {
      var v = p.perSkill[k];
      return '<div class="bar"><span>' + esc(k) + '</span>' + barTrack(v[1] ? v[0] / v[1] : 0) + '<span>' + v[0] + '/' + v[1] + '</span></div>';
    }).join('');
    return '<section class="result"><p class="meta">Tahmini seviye</p><p class="level">' + esc(p.level) + '</p><p>' + esc(p.note) + '</p>' +
      '<div class="bars">' + skills + '</div>' +
      (p.seeded ? '<p class="fb near">Bilemediğin ' + p.seeded + ' kalıp tekrar destesine eklendi; ilk tekrarları yarın.</p>' : '') +
      '<p class="hint">Kaba bir tahmin: konuşma ölçülmedi, dinleme sentetik sesle yapıldı.</p>' +
      '<div class="row"><button class="btn btn-primary" data-act="back">Bugün’e dön</button>' +
      '<button class="btn btn-quiet" data-act="pl-restart">Testi yeniden yap</button></div></section>';
  }

  // learn
  function viewLearn(c) {
    var chunks = c.chunks || [];
    var L = ui.tmp.learn;
    if (!L) {
      if (!chunks.length) { if (!session(state.programDay).blocks.learn) markDone('learn'); return learnDoneView(c, null); }
      if (session(state.programDay).blocks.learn) return learnDoneView(c, null);
      L = ui.tmp.learn = { phase: 'intro', idx: 0, known: {}, queue: [], first: {}, retried: {}, check: null, given: '', practice: false };
    }
    if (L.phase === 'intro') {
      return (state.programDay === 1 && c.grammar ? grammarCard(c.grammar, 'Bugünün kalıbı') : '') +
        '<p class="task">' + chunks.length + ' kalıp. Her birini dinle, iki kez sesli söyle ve deftere elle yaz. Ardından aynı gün hatırlama turu gelir.</p>' +
        '<button class="btn btn-primary wide" data-primary data-act="learn-begin">Başla</button>';
    }
    if (L.phase === 'meet') {
      var ch = chunks[L.idx];
      return '<p class="meta">Kalıp ' + (L.idx + 1) + ' / ' + chunks.length + '</p>' +
        '<p class="de" lang="de">' + esc(ch.de) + '</p><p class="tr">' + esc(ch.tr) + '</p>' +
        '<p class="hint">Dinle. İki kez sesli söyle. Deftere elle yaz.</p>' +
        '<div class="row"><button class="btn" data-act="say" data-text="' + esc(ch.de) + '">Dinle</button>' +
        (L.practice ? '' : '<button class="btn btn-quiet" data-act="learn-known">Zaten biliyorum</button>') +
        '<button class="btn btn-primary" data-primary data-act="learn-next">Sonraki</button></div>';
    }
    if (L.phase === 'recall') {
      var item = findChunk(c, L.queue[0]);
      return '<p class="meta">Aynı gün hatırlama: ' + L.queue.length + ' kaldı</p>' +
        '<p class="tr big">' + esc(item.tr) + '</p>' + answerInput(!!L.check, L.given) +
        (L.check ? feedback(L.check) + '<button class="btn btn-primary wide" data-primary data-act="learn-recall-next">Sonraki</button>'
          : checkButtons('learn'));
    }
    return learnDoneView(c, L);
  }
  function learnDoneView(c, L) {
    var st = session(state.programDay).stats.recall || [0, 0];
    var knownN = L ? Object.keys(L.known).length : 0, n = (c.chunks || []).length;
    return '<section class="result"><p class="level">Tamam.</p>' +
      '<p>' + n + ' kalıp tekrar destesinde. İlk tekrarları yarın' + (knownN ? '; bildiğin ' + knownN + ' kalıp bir hafta sonra' : '') + '.</p>' +
      (st[1] ? '<p>İlk denemede ' + st[0] + ' / ' + st[1] + ' doğru.</p>' : '') +
      '<div class="row"><button class="btn btn-primary" data-act="back">Bugün’e dön</button>' +
      (n ? '<button class="btn btn-quiet" data-act="learn-again">Kalıpları yeniden çalış</button>' : '') + '</div></section>';
  }
  function learnBegin() {
    var c = getDay(state.programDay), L = ui.tmp.learn; if (!L) return;
    L.phase = 'meet'; L.idx = 0;
    render();
    TTS.speak(c.chunks[0].de);
  }
  function learnAdvance(markKnown) {
    var c = getDay(state.programDay), L = ui.tmp.learn; if (!L || L.phase !== 'meet') return;
    var ch = c.chunks[L.idx];
    if (markKnown && !L.practice) L.known[ch.id] = true;
    L.idx++;
    if (L.idx < c.chunks.length) { render(); TTS.speak(c.chunks[L.idx].de); return; }
    L.phase = 'recall';
    L.queue = shuffle(c.chunks.filter(function (x) { return !L.known[x.id]; }).map(function (x) { return x.id; }));
    if (!L.queue.length) { learnFinish(); return; }
    TTS.stop();
    ui.tmp.focus = true;
    render();
  }
  function learnCheck() {
    var c = getDay(state.programDay), L = ui.tmp.learn; if (!L || L.check) return;
    var item = findChunk(c, L.queue[0]), v = ($('#ans') || {}).value || '';
    var r = C.checkAnswer(v, item.de, item.alt);
    if (r.status === 'empty') { toast('Önce Almancasını yaz.'); return; }
    L.check = r; L.given = v;
    learnFirst(L, item, r.status !== 'wrong');
    render();
    TTS.speak(r.target);
  }
  function learnFirst(L, item, ok) {
    if (L.first[item.id] !== undefined) return;
    L.first[item.id] = ok;
    if (!L.practice) bump('recall', ok);
  }
  function learnShow() {
    var c = getDay(state.programDay), L = ui.tmp.learn; if (!L || L.check) return;
    var item = findChunk(c, L.queue[0]);
    learnFirst(L, item, false);
    L.check = { status: 'shown', target: item.de, answer: '' }; L.given = '';
    render();
    TTS.speak(item.de);
  }
  // Leaves today's round; the card still comes back tomorrow like every new phrase.
  function learnSkip() {
    var c = getDay(state.programDay), L = ui.tmp.learn; if (!L || L.check) return;
    learnFirst(L, findChunk(c, L.queue[0]), false);
    L.queue.shift();
    learnAfter(L);
  }
  // A missed phrase is asked once more at the end of the round, never more.
  function learnRecallNext() {
    var L = ui.tmp.learn; if (!L || !L.check) return;
    var id = L.queue.shift();
    if ((L.check.status === 'wrong' || L.check.status === 'shown') && !L.retried[id]) { L.retried[id] = true; L.queue.push(id); }
    L.check = null; L.given = '';
    learnAfter(L);
  }
  function learnAfter(L) {
    if (!L.queue.length) { learnFinish(); return; }
    ui.tmp.focus = true;
    render();
  }
  function learnFinish() {
    var c = getDay(state.programDay), L = ui.tmp.learn;
    if (!L.practice) {
      c.chunks.forEach(function (ch) {
        if (L.known[ch.id]) addCard(ch.id, ch.tr, ch.de, ch.alt, 'chunk', 3, 7);
        else addCard(ch.id, ch.tr, ch.de, ch.alt, 'chunk', 1, 1);
      });
      markDone('learn');
    }
    L.phase = 'done';
    render();
  }
  function learnAgain() {
    var c = getDay(state.programDay);
    ui.tmp.learn = { phase: 'meet', idx: 0, known: {}, queue: [], first: {}, retried: {}, check: null, given: '', practice: true };
    render();
    TTS.speak(c.chunks[0].de);
  }

  // listen + shadowing
  function rateChips() {
    var r = state.settings.rate;
    return '<div class="rate" role="group" aria-label="Konuşma hızı"><span>Hız:</span>' + [[0.7, 'Yavaş'], [0.85, 'Orta'], [1, 'Normal']].map(function (p) {
      var on = Math.abs(r - p[0]) < 0.01;
      return '<button class="chip' + (on ? ' is-on' : '') + '" data-act="rate" data-v="' + p[0] + '" aria-pressed="' + on + '">' + p[1] + '</button>';
    }).join('') + '</div>';
  }
  function viewListen(c) {
    var LS = ui.tmp.ls || (ui.tmp.ls = { showDe: false, showTr: false, playing: false, cur: -1 });
    var d = c.dialogue, sp = d.speakers || { A: 'A', B: 'B' };
    var lines = d.lines.map(function (ln, i) {
      var key = 'd' + state.programDay + '-l' + i, has = !!state.recordings[key], recOn = !!(Rec.mr && Rec.key === key);
      return '<li class="line' + (LS.cur === i ? ' is-cur' : '') + '" data-line="' + i + '"><span class="who">' + esc(sp[ln.s] || ln.s) + '</span>' +
        '<p class="de' + (LS.showDe ? '' : ' is-hidden') + '" lang="de">' + (LS.showDe ? esc(ln.de) : '• • •') + '</p>' +
        (LS.showTr ? '<p class="tr">' + esc(ln.tr) + '</p>' : '') +
        '<div class="acts"><button class="btn mini" data-act="say" data-text="' + esc(ln.de) + '">Dinle</button>' +
        '<button class="btn mini' + (recOn ? ' rec-on' : '') + '" data-act="rec" data-key="' + key + '">' + (recOn ? 'Durdur' : 'Kaydet') + '</button>' +
        (has ? '<button class="btn mini" data-act="play-rec" data-reckey="' + key + '" data-key="' + key + '">Kendini dinle</button>' : '') +
        '</div></li>';
    }).join('');
    return '<p class="task">' + esc(d.title) + '</p>' +
      '<ol class="steps"><li>Metin kapalıyken dinle.</li><li>Bir kez daha dinle.</li><li>Metni ve Türkçesini aç, bilmediklerine bak.</li>' +
      '<li>Molalı çal: her satırdan sonra durakta sesli tekrar et.</li><li>Konuşmacıyla aynı anda söyle (shadowing).</li>' +
      '<li>Metni kapat, yine aynı anda söyle.</li><li>Bir satırını kaydet, modelle art arda dinle.</li></ol>' +
      '<div class="row"><button class="btn btn-primary" data-act="play-all">' + (LS.playing ? 'Durdur' : 'Hepsini çal') + '</button>' +
      '<button class="btn" data-act="toggle-de" aria-pressed="' + LS.showDe + '">' + (LS.showDe ? 'Metni gizle' : 'Metni göster') + '</button>' +
      '<button class="btn" data-act="toggle-tr" aria-pressed="' + LS.showTr + '">' + (LS.showTr ? 'Türkçeyi gizle' : 'Türkçeyi göster') + '</button></div>' +
      '<label class="check"><input type="checkbox" data-change="pause"' + (state.settings.pauseMode ? ' checked' : '') + '> Satır arasında tekrar molası</label>' +
      rateChips() +
      '<ul class="lines">' + lines + '</ul>' +
      '<button class="btn btn-primary wide" data-act="block-done" data-key="listen">Tamamladım</button>';
  }
  function pauseFor(text) {
    var w = String(text).split(/\s+/).length;
    return Math.max(1500, Math.round(w * 650 / (state.settings.rate || 0.9)));
  }
  function markLine(i) {
    $$('.line').forEach(function (el) {
      if (Number(el.getAttribute('data-line')) === i) el.classList.add('is-cur'); else el.classList.remove('is-cur');
    });
  }
  function playAll() {
    var LS = ui.tmp.ls; if (!LS) return;
    if (LS.playing) { LS.playing = false; LS.cur = -1; TTS.stop(); render(); return; }
    var lines = getDay(state.programDay).dialogue.lines, myTmp = ui.tmp, i = 0;
    LS.playing = true; LS.cur = 0;
    render();
    function step() {
      if (!LS.playing || ui.tmp !== myTmp) return;
      if (i >= lines.length) { LS.playing = false; LS.cur = -1; render(); return; }
      LS.cur = i; markLine(i);
      TTS.speak(lines[i].de).then(function () {
        if (!LS.playing || ui.tmp !== myTmp) return;
        var wait = state.settings.pauseMode ? pauseFor(lines[i].de) : 300;
        i++;
        return sleep(wait).then(step);
      });
    }
    step();
  }
  function recToggle(key) {
    if (Rec.mr) {
      Rec.stop().then(function (r) { if (r && r.key !== 'mic-test') toast('Kaydedildi (' + r.dur + ' sn).'); render(); });
      return;
    }
    TTS.stop();
    Rec.start(key).then(function (ok) { if (ok) render(); });
  }

  // produce
  function viewProduce(c) {
    var items = c.produce || [];
    var P = ui.tmp.pr || (ui.tmp.pr = { part: items.length ? 'A' : 'B', idx: 0, check: null, given: '', tag: null });
    if (P.part === 'A') {

        '<label class="sr" for="qa-' + q.id + '">Cevabın</label><textarea id="qa-' + q.id + '" class="answer" lang="de" autocapitalize="sentences" spellcheck="false" placeholder="Kendi cevabını yaz">' + esc(val) + '</textarea>' +
        '<button class="btn" data-act="qa-save" data-id="' + q.id + '">' + (saved ? 'Güncelle' : 'Kaydet') + '</button>' +

  function prCheck() {

    P.check = r; P.given = v; P.tag = r.status === 'wrong' && r.suggestTag != null ? r.suggestTag : null;
    bump('produce', r.status !== 'wrong');

    render();
    TTS.speak(r.target);
  }
  function prShow() {
    var c = getDay(state.programDay), P = ui.tmp.pr; if (!P || P.check) return;

    P.check = { status: 'shown', target: it.de, answer: '' }; P.given = ''; P.tag = null;

    save();

  // Shown or skipped sentences become a card for tomorrow; they are not errors in the notebook.
  function prSkip() {
    var c = getDay(state.programDay), P = ui.tmp.pr; if (!P || P.check) return;
    var it = c.produce[P.idx];
    bump('produce', false);
    addCard('pr-' + it.id, it.tr, it.de, it.alt, 'produce', 1, 1);
    save();
    prAdvance(c, P);
  }
  function prNext() {
    var c = getDay(state.programDay), P = ui.tmp.pr; if (!P || !P.check) return;
    var it = c.produce[P.idx];
    if (P.check.status === 'wrong') logError(it.tr, it.de, P.given, P.tag);

  // review (block and tab)
  function nextDueText() {
    var cards = vals(state.cards);
    if (!cards.length) return 'Henüz kart yok. Kartlar “Yeni kalıplar” bloğundan gelir.';
    var t = today(), next = null;
    cards.forEach(function (c) { if (c.due > t && (!next || c.due < next)) next = c.due; });
    if (!next) return 'Bekleyen kart yok.';
    var n = cards.filter(function (c) { return c.due === next; }).length, d = C.daysBetween(t, next);
    return 'Sonraki tekrar ' + (d === 1 ? 'yarın' : d + ' gün sonra') + ': ' + n + ' kart.';
  }
  function reviewBody(isBlock) {
    var R = ui.tmp.rev;
    if (!R) R = ui.tmp.rev = { queue: dueCards().map(function (c) { return c.id; }), idx: 0, check: null, given: '', tag: null, ok: 0, n: 0 };
    var back = isBlock ? '<button class="btn btn-primary wide" data-act="back">Bugün’e dön</button>' : '';
    if (!R.queue.length) {
      if (isBlock && !session(state.programDay).blocks.review) markDone('review');
      return '<section class="empty"><h2 class="sub">Bugün tekrar yok.</h2><p>' + esc(nextDueText()) + '</p>' + back + '</section>';
    }
    if (R.idx >= R.queue.length) {
      if (isBlock && !session(state.programDay).blocks.review) markDone('review');
      return '<section class="result"><p class="level">' + R.ok + ' / ' + R.n + '</p><p>Tekrar bitti. Bilemediklerin' +
        (R.skipped ? ' ve atladığın ' + R.skipped + ' kart' : '') + ' yarın yeniden gelecek.</p>' + back + '</section>';
    }
    var card = state.cards[R.queue[R.idx]];
    var h = '<p class="meta">Kart ' + (R.idx + 1) + ' / ' + R.queue.length + '</p><p class="tr big">' + esc(card.tr) + '</p>' + answerInput(!!R.check, R.given);
    if (!R.check) return h + checkButtons('rv');
    h += feedback(R.check);
    if (R.check.status === 'shown') return h + '<button class="btn btn-primary wide" data-primary data-act="rv-grade" data-g="wrong">Sonraki</button>';
    if (R.check.status === 'wrong') return h + tagPicker(R.tag) + '<button class="btn btn-primary wide" data-primary data-act="rv-grade" data-g="wrong">Sonraki</button>';
    return h + '<div class="row two"><button class="btn" data-act="rv-grade" data-g="hard">Zorlandım</button>' +
      '<button class="btn btn-primary" data-primary data-act="rv-grade" data-g="easy">Kolaydı</button></div>';
  }
  function rvCheck() {
    var R = ui.tmp.rev; if (!R || R.check) return;
    var card = state.cards[R.queue[R.idx]], v = ($('#ans') || {}).value || '';
    var r = C.checkAnswer(v, card.de, card.alt);
    if (r.status === 'empty') { toast('Önce Almancasını yaz.'); return; }
    R.check = r; R.given = v; R.tag = r.status === 'wrong' && r.suggestTag != null ? r.suggestTag : null;

    var R = ui.tmp.rev; if (!R || R.check || R.idx >= R.queue.length) return;

  // Postpones the card to tomorrow without counting it as forgotten.
  function rvSkip() {
    var R = ui.tmp.rev; if (!R || R.check || R.idx >= R.queue.length) return;
    var card = state.cards[R.queue[R.idx]];
    card.due = C.addDays(today(), 1);

    R.idx++;
    ui.tmp.focus = R.idx < R.queue.length;

  }
  function rvGrade(g) {
    var R = ui.tmp.rev; if (!R || !R.check) return;
    var card = state.cards[R.queue[R.idx]], ok = g !== 'wrong';
    if (!ok && R.check.status !== 'shown') logError(card.tr, card.de, R.given, R.tag);
    C.schedule(card, g, today());
    R.n++; if (ok) R.ok++;
    bump('review', ok);
    save();

    ui.tmp.focus = R.idx < R.queue.length;
    render();
  }

  function phaseGate() {
    var ph = phaseOf(Math.min(state.programDay, TOTAL_DAYS));
    var ids = Object.keys(state.cards).filter(function (id) { var m = /^d(\d+)-/.exec(id); return m && +m[1] >= ph.from && +m[1] <= ph.to; });
    if (!ids.length) return 'Faz ' + ph.n + ' kartları henüz yok.';
    var strong = ids.filter(function (id) { return (state.cards[id].box || 1) >= 2; }).length;
    var share = Math.round(100 * strong / ids.length);
    var a = accOf(completedDays().slice(-3)), accP = a[1] ? Math.round(100 * a[0] / a[1]) : 0;
    var ready = share >= 80 && accP >= 75;
    return 'Faz ' + ph.n + ' kartlarının %' + share + '’i en az bir kez tutuldu; son 3 günün doğruluğu %' + accP + '. ' +
      (ready ? 'Sonraki faza hazırsın.' : 'Eşik: %80 kart ve %75 doğruluk.');
  }

  function buildDump() {
    var n = state.programDay, done = completedDays(), recent = done.slice(-7);
    var sums = { recall: [0, 0], review: [0, 0], produce: [0, 0] };
    recent.forEach(function (d) {
      var st = (state.sessions[d] || {}).stats || {};
      Object.keys(sums).forEach(function (k) { if (st[k]) { sums[k][0] += st[k][0]; sums[k][1] += st[k][1]; } });
    });
    function pct(p) { return p[1] ? Math.round(100 * p[0] / p[1]) + '% (' + p[0] + '/' + p[1] + ')' : '-'; }
    var cards = vals(state.cards), boxes = [0, 0, 0, 0, 0, 0, 0];
    cards.forEach(function (c) { boxes[Math.min(c.box || 1, 6)]++; });
    var counts = {}, ex = {};
    state.errors.forEach(function (e) { var t = e.tag || 'Etiketsiz'; counts[t] = (counts[t] || 0) + 1; (ex[t] = ex[t] || []).push(e); });
    var top = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 5);
    var weak = cards.filter(function (c) { return (c.lapses || 0) > 0; })
      .sort(function (a, b) { return (b.lapses - a.lapses) || ((a.box || 1) - (b.box || 1)); }).slice(0, 10);
    var answers = state.answers.filter(function (a) { return a.day > n - 8; });
    var from = maxContentDay() + 1, to = Math.min(from + 6, TOTAL_DAYS);
    var L = [];
    L.push('SPRUNG HAFTALIK DÖKÜM');
    L.push('Program günü: ' + n + ', tamamlanan gün: ' + done.length);
    if (state.placement) {
      L.push('Seviye testi: ' + state.placement.level + ' (' + Object.keys(state.placement.perSkill || {}).map(function (k) {
        var v = state.placement.perSkill[k]; return k + ' ' + v[0] + '/' + v[1];
      }).join(', ') + ')');
    }
    L.push('Son 7 gün doğruluk: hatırlama ' + pct(sums.recall) + ', tekrar ' + pct(sums.review) + ', üretim ' + pct(sums.produce));
    L.push('Kartlar: kutu1 ' + boxes[1] + ', kutu2 ' + boxes[2] + ', kutu3 ' + boxes[3] + ', kutu4 ' + boxes[4] + ', kutu5 ' + boxes[5] + ', ustalaşan ' + boxes[6]);
    L.push('');
    L.push('En sık hatalar:');
    if (!top.length) L.push('- yok');
    top.forEach(function (t) {
      L.push('- ' + t + ' (' + counts[t] + ')');
      ex[t].slice(-2).forEach(function (e) { L.push('  TR: ' + e.tr + ' | Doğru: ' + e.expected + ' | Benim: ' + e.given); });
    });
    L.push('');
    L.push('En çok unuttuğum kartlar:');
    if (!weak.length) L.push('- yok');
    weak.forEach(function (c) { L.push('- ' + c.de + ' (' + c.tr + '), unutma: ' + c.lapses); });
    L.push('');
    L.push('Serbest cevaplarım (düzelt, daha doğal versiyonunu ver):');
    if (!answers.length) L.push('- yok');
    answers.forEach(function (a) { L.push('- ' + a.q + ' -> ' + a.answer); });
    L.push('');
    if (from <= TOTAL_DAYS) {
      L.push('İSTEK: Önce serbest cevaplarımı düzelt. Sonra bu döküme göre Gün ' + from + '–' + to + ' için içerik paketini tek bir JSON kod bloğu olarak ver.');
      L.push('Kurallar: her gün bir görev etrafında; 12–14 kalıp, 8–10 satırlık diyalog, 5 üretim cümlesi, 3 kişisel soru, kısa gramer notu. ' +
        'Zayıf yapılarımı yeni bağlamlarda tekrar getir. Gün 8’den itibaren her güne 2–3 tıbbi Almanca kalıp ekle. ' +
        'Fazlar: 8–14 günlük hayat (rol yapma), 15–21 spontane anlatım, 22–30 gerçek hayat simülasyonu. Her kalıba kabul edilebilecek diğer doğru cevapları "alt" içine yaz.');
      L.push('Şema: {"version":1,"days":[{"day":' + from + ',"title":"TR başlık","titleDe":"DE başlık","task":"TR görev",' +
        '"grammar":{"title":"...","points":["..."],"examples":[{"de":"...","tr":"..."}]},' +
        '"chunks":[{"id":"d' + from + '-01","de":"...","tr":"...","alt":["..."]}],' +
        '"dialogue":{"title":"...","speakers":{"A":"...","B":"Kerem"},"lines":[{"s":"A","de":"...","tr":"..."}]},' +
        '"produce":[{"id":"d' + from + '-p1","tr":"...","de":"...","alt":[]}],' +
        '"questions":[{"id":"d' + from + '-q1","q":"...","tr":"...","model":"..."}]}]}');
    } else {
      L.push('İSTEK: 30 gün bitti. Başlangıç ve son durumu karşılaştırmama yardım et.');
    }
    return L.join('\n');
  }
  function validDay(d) {
    return !!(d && typeof d.day === 'number' && d.day >= 1 && d.title && d.task &&
      Array.isArray(d.chunks) && d.chunks.every(function (c) { return c && c.id && c.de && c.tr; }) &&
      d.dialogue && Array.isArray(d.dialogue.lines) && d.dialogue.lines.every(function (l) { return l && l.de; }));
  }
  function importPack() {
    var raw = (($('#pack') || {}).value || '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
    var obj;
    try { obj = JSON.parse(raw); } catch (e) { toast('JSON okunamadı. Paketin tamamını yapıştırdığından emin ol.'); return; }
    var days = Array.isArray(obj) ? obj : obj && obj.days;
    if (!Array.isArray(days) || !days.length) { toast('Pakette “days” listesi yok.'); return; }
    var bad = days.filter(function (d) { return !validDay(d); });
    if (bad.length) { toast('Geçersiz gün var. Her günde day, title, task, chunks ve dialogue olmalı.'); return; }
    days.forEach(function (d) {
      d.produce = d.produce || []; d.questions = d.questions || [];
      state.extraDays = state.extraDays.filter(function (x) { return x.day !== d.day; });
      state.extraDays.push(d);
    });
    save();
    render();
    toast(days.length + ' gün eklendi.');
  }
  function restoreBackup() {
    var raw = (($('#restore') || {}).value || '').trim();
    try {
      var s = JSON.parse(raw);
      if (!s || s.v !== 1 || typeof s.cards !== 'object') throw new Error('bad');
      state = hydrate(s);
      recheckErrors();
      save();
      go('today');
      toast('Yedek geri yüklendi.');
    } catch (e) { toast('Yedek okunamadı. Kopyaladığın metnin tamamını yapıştır.'); }
  }
  function resetAll() {
    if (!window.confirm('Tüm ilerleme, kartlar ve kayıtlar silinecek. Emin misin?')) return;
    if (!window.confirm('Bu geri alınamaz. Siliyorum?')) return;
    localStorage.removeItem(STORE_KEY);
    state = defaultState();
    if (AudioDB.ok) AudioDB.clear().catch(function () {});
    AudioCache.urls = {};
    save();
    go('today');
    toast('Tüm veriler silindi.');
  }

  // ---------- events ----------
  var actions = {
    'tab': function (el) { go(el.getAttribute('data-view')); },
    'back': function () { go('today'); },
    'open-block': function (el) { go('block', el.getAttribute('data-key')); },
    'say': function (el) { TTS.speak(el.getAttribute('data-text')); },
    'finish-day': finishDay,
    'block-done': function (el) { markDone(el.getAttribute('data-key')); go('today'); toast('Blok tamamlandı.'); },
    'pl-start': plStart,
    'pl-restart': function () { state.placement = null; save(); plStart(); },
    'pl-choose': function (el) { plChoose(Number(el.getAttribute('data-i'))); },
    'pl-type': plType,
    'pl-next': plNext,
    'learn-begin': learnBegin,
    'learn-next': function () { learnAdvance(false); },
    'learn-known': function () { learnAdvance(true); },
    'learn-check': learnCheck,
    'learn-show': learnShow,
    'learn-skip': learnSkip,
    'learn-recall-next': learnRecallNext,
    'learn-again': learnAgain,
    'play-all': playAll,
    'toggle-de': function () { if (ui.tmp.ls) { ui.tmp.ls.showDe = !ui.tmp.ls.showDe; render(); } },
    'toggle-tr': function () { if (ui.tmp.ls) { ui.tmp.ls.showTr = !ui.tmp.ls.showTr; render(); } },
    'rate': function (el) { state.settings.rate = Number(el.getAttribute('data-v')); save(); render(); },
    'rec': function (el) { recToggle(el.getAttribute('data-key')); },
    'play-rec': function (el) { AudioCache.play(el.getAttribute('data-key')); },
    'pr-check': prCheck,
    'pr-show': prShow,
    'pr-skip': prSkip,
    'pr-next': prNext,
    'qa-save': function (el) { qaSave(el.getAttribute('data-id')); },
    'tag': function (el) {
      var T = ui.tmp.pr || ui.tmp.rev; if (!T) return;
      var i = Number(el.getAttribute('data-i')); T.tag = T.tag === i ? null : i; render();
    },
    'rv-check': rvCheck,
    'rv-show': rvShow,
    'rv-skip': rvSkip,
    'rv-grade': function (el) { rvGrade(el.getAttribute('data-g')); },
    'copy-dump': function () { copyText(buildDump(), 'Döküm kopyalandı. Claude’a yapıştır.'); },
    'import-pack': importPack,
    'copy-backup': function () { copyText(JSON.stringify(state), 'Yedek kopyalandı.'); },
    'restore': restoreBackup,
    'reset': resetAll,
    'modal-close': function () { var m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
  };

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    var fn = actions[el.getAttribute('data-act')];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, k = el.getAttribute && el.getAttribute('data-change');
    if (!k) return;
    if (k === 'pause') { state.settings.pauseMode = !!el.checked; save(); }
    if (k === 'rate') { state.settings.rate = Number(el.value); save(); var o = $('#rate-out'); if (o) o.textContent = state.settings.rate.toFixed(2); }
    if (k === 'voice') { state.settings.voiceURI = el.value; save(); TTS.speak('Hallo! So klinge ich.'); }
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.id && el.id.indexOf('qa-') === 0) { ui.tmp.drafts = ui.tmp.drafts || {}; ui.tmp.drafts[el.id] = el.value; }
    if (el.getAttribute && el.getAttribute('data-change') === 'rate') { var o = $('#rate-out'); if (o) o.textContent = Number(el.value).toFixed(2); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.matches && e.target.matches('input.answer')) {
      e.preventDefault();
      var b = $('[data-primary]');
      if (b && !b.disabled) b.click();
    }
  });

  // ---------- start ----------
  if (TTS.ok) {
    TTS.load();
    var onVoices = function () { TTS.load(); if (ui.view === 'settings') render(); };
    if (window.speechSynthesis.addEventListener) window.speechSynthesis.addEventListener('voiceschanged', onVoices);
    else window.speechSynthesis.onvoiceschanged = onVoices;
  }
  var cleared = recheckErrors();
  render();
  if (cleared) toast('Yazım yüzünden yanlış sayılan ' + cleared + ' cevap hata defterinden silindi.');
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();

</script>
</body>
</html>
